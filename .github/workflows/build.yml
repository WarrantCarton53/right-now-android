name: Build Right Now app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Build the app
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk RightNow.apk
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Right Now (build ${{ github.run_number }})
          body: Download RightNow.apk on your Android phone and open it to install or update.
          files: RightNow.apk
          make_latest: true
